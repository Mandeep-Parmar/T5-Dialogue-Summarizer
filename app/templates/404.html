<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Page not found · Text Summarizer" />
    <title>404 Not Found · Text Summarizer</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <a href="/" class="brand" title="Back to Text Summarizer home">
          <div class="brand-logo" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="24" rx="6" fill="#496B55"/>
              <path d="M6.5 8C6.5 7.17 7.17 6.5 8 6.5H16C16.83 6.5 17.5 7.17 17.5 8V12.5C17.5 13.33 16.83 14 16 14H11.5L8.5 16.5V14H8C7.17 14 6.5 13.33 6.5 12.5V8Z" fill="white" fill-opacity="0.25"/>
              <path d="M9.5 9.5H14.5M9.5 11.5H12.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="brand-name">Text Summarizer</span>
          <span class="brand-badge">Powered by T5</span>
        </a>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="container not-found-container" role="main">
      <div class="not-found-card">
        <div class="not-found-code" aria-hidden="true">404</div>
        <h1 class="not-found-heading">Page not found.</h1>
        <p class="not-found-description">The page you're looking for doesn't exist or may have been moved.</p>
        <div class="not-found-actions">
          <a href="/" class="primary-btn not-found-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p class="footer-note">T5-small model fine-tuned on SAMSum dialogue dataset.</p>
    </footer>
  </body>
</html>
