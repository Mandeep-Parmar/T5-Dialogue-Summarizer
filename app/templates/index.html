<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn lengthy conversations, chats, and dialogues into clear, concise summaries using fine-tuned T5." />
    <title>Text Summarizer · Powered by T5</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="24" rx="6" fill="#496B55"/>
              <path d="M6.5 8C6.5 7.17 7.17 6.5 8 6.5H16C16.83 6.5 17.5 7.17 17.5 8V12.5C17.5 13.33 16.83 14 16 14H11.5L8.5 16.5V14H8C7.17 14 6.5 13.33 6.5 12.5V8Z" fill="white" fill-opacity="0.25"/>
              <path d="M9.5 9.5H14.5M9.5 11.5H12.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="brand-name">Text Summarizer</span>
          <span class="brand-badge">Powered by T5</span>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
      <!-- Editorial Hero Header -->
      <section class="hero-section">
        <h1 class="main-heading">Make long conversations shorter.</h1>
        <p class="sub-heading">Turn lengthy conversations, chats, and dialogues into clear, concise summaries.</p>
      </section>

      <!-- Input Card -->
      <form id="summarization-form" class="editor-card">
        <div class="editor-header">
          <label for="dialogue-input" class="editor-label">Source Text</label>
          <button type="button" id="clear-btn" class="action-btn text-muted" title="Clear text" aria-label="Clear input text">Clear</button>
        </div>

        <div class="editor-body">
          <textarea
            id="dialogue-input"
            name="dialogue"
            placeholder="Paste your text or conversation here..."
            required
            rows="8"
            spellcheck="false"
          ></textarea>
        </div>

        <div class="editor-footer">
          <div class="counter-group" id="counter-group" aria-live="polite">
            <span id="char-count">0</span> characters
            <span class="counter-dot" aria-hidden="true">·</span>
            <span id="word-count">0</span> words
          </div>
          <button type="submit" id="submit-btn" class="primary-btn" disabled>
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Summarize</span>
          </button>
        </div>
      </form>

      <!-- Error Banner (Hidden by default) -->
      <div id="error-banner" class="error-banner" role="alert" hidden>
        <svg class="error-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="error-message"></span>
      </div>

      <!-- Output Section -->
      <section class="summary-output" aria-live="polite">
        <div class="summary-output-header">
          <div class="summary-title-wrapper">
            <h2 id="summary-heading">Summary</h2>
            <span id="summary-status-badge" class="status-badge" hidden>Generated</span>
          </div>
          <button type="button" id="copy-btn" class="copy-btn" title="Copy summary to clipboard" aria-label="Copy summary to clipboard" disabled>
            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="copy-btn-text">Copy</span>
          </button>
        </div>

        <div class="summary-output-body">
          <p id="summary-text" class="placeholder-text">Your summary will appear here.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p class="footer-note">T5-small model fine-tuned on SAMSum dialogue dataset.</p>
    </footer>

    <script src="/static/js/script.js"></script>
  </body>
</html>
